<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191e1c"><title>Boutique studio · 3D designer</title>
<style>
:root{
  color-scheme:dark;
  --paper:#191e1c;
  --stage:#151a19;
  --field:#222925;
  --ink:#f1f1e9;
  --muted:#b5bdb5;
  --sage:#b5d5b7;
  --line:#39423d;
  --control-edge:#57645c;
  --soft:#303b34;
  --selected:#304b3b;
  --selected-ink:#def1d9;
  --accent-ink:#18271d;
  --glass:rgba(28,34,31,.96);
  --shadow:0 3px 17px #0005;
  --serif:Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",Arial,sans-serif;
  font:14px var(--sans);color:var(--ink);background:var(--paper)
}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,input,select{font:inherit;color:inherit}button,select,input[type=range]{cursor:pointer}button{background:none;border:0}button,select{touch-action:manipulation}button:disabled{cursor:wait;opacity:.6}button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible,summary:focus-visible{outline:2px solid var(--sage);outline-offset:3px}button:hover:not(:disabled):not(.chip){filter:brightness(1.12)}[hidden]{display:none!important}svg.ico{height:19px;width:19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 25px 0 28px;border-bottom:1px solid var(--line);background:var(--paper);flex:none;gap:16px}h1{font:normal 30px/1 var(--serif);letter-spacing:-1.3px;margin:0}.head-actions{display:flex;align-items:center;gap:9px}.action{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:36px;border:1px solid var(--control-edge);background:var(--field);border-radius:8px;padding:0 13px;font-size:13px;font-weight:600}.primary{background:var(--sage);border-color:var(--sage);color:var(--accent-ink)}.primary svg.ico{width:16px}
main{display:grid;grid-template-columns:minmax(0,1fr) clamp(310px,27vw,392px);min-height:0;flex:1}
#stage{position:relative;isolation:isolate;min-width:0;min-height:150px;overflow:hidden;background:var(--stage)}#view{display:block;width:100%;height:100%;touch-action:none}#fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--field);z-index:1}#status{position:absolute;inset:0;z-index:2;display:grid;place-content:center;background:rgba(21,26,25,.95);text-align:center;font-size:14px;pointer-events:none}#status.fail{inset:auto 20px 82px;padding:10px 14px;border:1px solid var(--line);background:var(--paper);border-radius:8px}.stage-top{position:absolute;top:17px;left:19px;right:19px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none}.stage-top>*{pointer-events:auto}.quality{display:flex;gap:3px;padding:3px;border:1px solid var(--control-edge);border-radius:28px;background:var(--glass);box-shadow:var(--shadow)}.quality button{padding:6px 11px;border-radius:20px;color:var(--muted);font-size:12px;line-height:1.25}.quality button[aria-pressed=true]{background:var(--sage);color:var(--accent-ink)}.tools{display:flex;align-items:center;border-radius:10px;border:1px solid var(--control-edge);background:var(--glass);padding:2px;box-shadow:var(--shadow)}.tools button{display:grid;place-items:center;width:33px;height:33px;border-radius:7px}.tools button:hover{background:var(--soft)}#sample{position:absolute;top:60px;left:24px;font-size:11px;color:var(--muted);padding:4px 7px;border-radius:5px;background:var(--glass)}
.stage-bottom{position:absolute;bottom:17px;left:14px;right:14px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}.view-nav{display:flex;flex-wrap:nowrap;max-width:100%;padding:4px;border:1px solid var(--control-edge);border-radius:12px;background:var(--glass);box-shadow:var(--shadow);pointer-events:auto;overflow-x:auto;scrollbar-width:thin}.view-nav button{display:flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap;border-radius:8px;padding:8px 11px;font-size:12px;color:var(--muted)}.view-nav button[aria-pressed=true]{background:var(--selected);color:var(--selected-ink);font-weight:650}.view-nav .ico{width:16px;height:16px}.nav-hint{font-size:11px;color:var(--muted);background:var(--glass);padding:2px 5px;border-radius:4px}.designer{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}.tabs{display:flex;justify-content:space-between;flex:none;padding:0 20px;gap:12px;border-bottom:1px solid var(--line)}.tabs button{padding:16px 1px 13px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}.tabs button[aria-selected=true]{border-color:var(--sage);color:var(--sage)}.panel{padding:22px 22px 28px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--control-edge) transparent;flex:1}.group{padding:0 0 20px;margin:0 0 20px;border-bottom:1px solid var(--line)}.group:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}.group-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 12px}.group-title h2,.panel-title{margin:0;font:normal 21px/1.25 var(--serif);letter-spacing:-.45px}.value{color:var(--muted);font-size:12px;text-align:right}.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px 7px}.swatches[data-kind=wall]{grid-template-columns:repeat(7,minmax(0,1fr));gap:9px 6px}.chip{position:relative;border-radius:6px;height:33px;padding:0;background-position:center;background-size:cover;border:1px solid #fff4;box-shadow:inset 0 1px 3px #ffffff19}.chip[aria-pressed=true]{outline:2px solid var(--sage);outline-offset:2px}.chip[aria-pressed=true]:after{content:"✓";position:absolute;bottom:2px;right:2px;border-radius:50%;background:var(--accent-ink);color:var(--selected-ink);width:14px;height:14px;line-height:14px;font-size:10px;font-weight:700}.chip:hover:before{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--selected);color:var(--selected-ink);padding:4px 6px;white-space:nowrap;border-radius:4px;content:attr(aria-label);font-size:11px;z-index:4;pointer-events:none}.swatches[data-kind=wall] .chip{height:31px}.selectbox{display:block;width:100%;height:39px;margin-top:11px;padding:0 9px;border-radius:6px;background:var(--field);border:1px solid var(--control-edge);font-size:13px}.lights{display:grid;grid-template-columns:1fr 1fr;gap:6px}.lights button{min-height:36px;padding:7px 8px;text-align:left;border:1px solid var(--control-edge);background:var(--field);border-radius:6px;font-size:12px}.lights button[aria-pressed=true]{background:var(--selected);border-color:var(--sage);color:var(--selected-ink)}.range{display:block;margin:0 0 16px}.range:last-child{margin-bottom:0}.rlabel{display:flex;justify-content:space-between;align-items:center;font-weight:550;font-size:13px}.rlabel output{font-size:12px;color:var(--sage);font-weight:550;font-variant-numeric:tabular-nums}input[type=range]{appearance:none;width:100%;height:5px;border-radius:5px;margin:11px 0 3px;background:linear-gradient(to right,var(--sage) var(--pct,50%),var(--control-edge) var(--pct,50%));accent-color:var(--sage)}input#kelvin{background:linear-gradient(90deg,#f1b363,#f6e2b9 45%,#b6d2e3)}input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;background:var(--ink);border:2px solid var(--selected);border-radius:50%;box-shadow:0 1px 3px #0006}input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--ink);border:2px solid var(--selected);border-radius:50%}.presets{display:grid;grid-template-columns:1fr 1fr;gap:9px}.look{overflow:hidden;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:0}.look img{width:100%;aspect-ratio:1.5;display:block;object-fit:cover;object-position:50% 48%}.look span{display:block;padding:8px;font-weight:550;font-size:12px}.save-row{display:flex;gap:7px}.save-row input{min-width:0;flex:1;height:35px;border:1px solid var(--control-edge);border-radius:6px;padding:0 8px;background:var(--field)}.saved{display:flex;gap:4px;border-bottom:1px solid var(--line);align-items:center;margin-top:6px;padding:4px 0}.saved .use{flex:1;text-align:left;padding:8px 0;font-size:13px;font-weight:600;overflow-wrap:anywhere}.saved .delete{font-size:12px;color:var(--muted);padding:6px}.note{color:var(--muted);font-size:12px;line-height:1.55;margin:8px 0 0}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;color:var(--selected-ink);background:var(--selected);border:1px solid var(--control-edge);padding:9px 15px;border-radius:8px;box-shadow:var(--shadow);font-size:13px}
@media(min-width:1550px){header{padding-inline:36px}.panel{padding:26px 28px}.chip{height:38px}.group{padding-bottom:23px;margin-bottom:23px}}
@media(max-width:850px){main{grid-template-columns:minmax(0,1fr) 280px}.panel{padding:18px}.stage-top{left:10px;right:10px}.view-nav button{padding:8px}.view-nav .ico{display:none}}
@media(max-width:690px){header{height:53px;padding:0 13px;gap:8px}h1{font-size:25px}.action{padding:0 10px;min-height:32px;font-size:12px}.head-actions{gap:5px}.head-actions .action svg{width:15px}.head-actions #jump-save span{display:none}main{display:flex;flex-direction:column;min-height:0;flex:1}#stage{flex:1;min-height:37vh}.designer{height:40%;min-height:170px;max-height:385px;border-left:0;border-top:1px solid var(--line)}.tabs{justify-content:flex-start;gap:22px;padding-inline:17px}.tabs button{padding:9px 1px 6px}.panel{padding:13px 16px 20px}.group{padding-bottom:13px;margin-bottom:13px}.group-title{margin-bottom:9px}.group-title h2{font-size:18px}.swatches{grid-template-columns:repeat(9,minmax(0,1fr))}.swatches[data-kind=wall]{grid-template-columns:repeat(7,minmax(0,1fr))}.chip{height:29px}.swatches[data-kind=wall] .chip{height:23px}.stage-top{top:8px}.stage-bottom{bottom:7px;gap:3px}.nav-hint{display:none}.view-nav{padding:2px}.view-nav button{font-size:11px;padding:6px 8px}.quality button{padding:4px 8px}.tools button{width:27px;height:27px}.tools .ico{width:15px}.selectbox{height:33px}.look img{max-height:90px}#sample{top:39px;left:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.camera-details{min-width:0;max-width:89px;font:inherit;font-size:12px;color:var(--ink);background:var(--field);border:1px solid var(--control-edge);border-radius:7px;margin-left:3px;padding-left:5px}.camera-details.selected{background:var(--selected);color:var(--selected-ink)}#door{position:absolute;top:18px;left:50%;transform:translateX(-50%);border:1px solid var(--control-edge);background:var(--glass);color:var(--ink);padding:7px 12px;font-size:12px;border-radius:18px}#door[aria-pressed=true]{background:var(--selected);color:var(--selected-ink)}@media(max-width:690px){.camera-details{max-width:65px;font-size:11px;padding-left:2px}#door{top:44px;left:auto;right:10px;transform:none;font-size:10px;padding:5px 8px}}

.custom-paints{display:flex;gap:14px;margin-top:10px}
.custom-paints label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer}
.custom-paints input{width:27px;height:23px;padding:1px;border:1px solid var(--control-edge);border-radius:4px;background:var(--field);cursor:pointer}
.save-row input::placeholder{color:var(--muted);opacity:1}
.chip:hover,.chip:focus-visible{box-shadow:0 0 0 1px var(--ink)}

.material-group{border-bottom:1px solid var(--line);margin-bottom:12px;padding:0 0 13px}
.material-group summary{display:flex;align-items:center;gap:9px;list-style:none;cursor:pointer;min-height:38px;padding:5px 1px}
.material-group summary::-webkit-details-marker{display:none}
.material-group .category-name{font:normal 20px/1.2 var(--serif);letter-spacing:-.4px}
.material-group .value{margin-left:auto;max-width:46%;text-align:right}
.material-group summary:after{content:'';width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:0 3px 4px 0}
.material-group[open] summary:after{transform:rotate(225deg);margin-top:6px}
.material-group[open] summary{margin-bottom:9px}.material-group:last-child{border-bottom:0}
.find-field{width:100%;border:1px solid var(--control-edge);background:var(--field);color:var(--ink);border-radius:7px;height:38px;padding:0 10px;margin-bottom:12px;font-size:13px}
.find-field::placeholder{color:var(--muted)}.swatches[data-kind=collection]{grid-template-columns:repeat(4,minmax(0,1fr))}
.swatches[data-kind=outfitLeft],.swatches[data-kind=outfitRight]{grid-template-columns:repeat(7,minmax(0,1fr))}
.action.icon-only{width:34px;padding:0}.action:disabled{opacity:.34;cursor:default}
.head-actions .history{display:flex;gap:4px;margin-right:4px}
.speed-menu{appearance:auto;color:var(--ink);background:var(--field);border:1px solid var(--control-edge);border-radius:12px;max-width:105px;padding:4px 3px;font-size:11px}
.stage-quality{display:flex;align-items:center;gap:6px}.comparison,.file-actions{display:flex;gap:8px;flex-wrap:wrap}.comparison>div{flex:1;min-width:95px;display:grid;gap:5px}.comparison .load{border-color:var(--control-edge);background:var(--selected);color:var(--selected-ink)}
.look .recipe-colours{display:flex;min-height:39px;border-bottom:1px solid var(--line)}.recipe-colours i{flex:1}
.look .recipe-meta{padding:0 8px 8px;font-weight:normal;color:var(--muted);font-size:11px}
.range-heading{font-size:12px;color:var(--sage);font-weight:600;margin:19px 0 12px}.range-heading:first-child{margin-top:0}
#fixture-status{position:absolute;left:21px;bottom:87px;background:var(--glass);border:1px solid var(--line);padding:6px 9px;border-radius:6px;font-size:12px;color:var(--muted)}
@media(max-width:690px){.head-actions{gap:4px}.head-actions .history{margin-right:1px;gap:2px}.action.icon-only{width:27px;min-height:30px}.head-actions .action{padding-inline:7px}.tabs{justify-content:space-between;gap:8px}.speed-menu{max-width:81px;font-size:10px}.stage-quality{gap:3px}.material-group{margin-bottom:6px;padding-bottom:7px}.material-group .category-name{font-size:18px}#fixture-status{bottom:42px;left:10px}#door{top:52px}.chip:hover:before{display:none}}
@media(max-width:365px){header{gap:3px;padding:0 8px}h1{font-size:21px}.head-actions{gap:2px}.action.icon-only{width:24px}.camera-details{max-width:58px}.view-nav button{padding-inline:6px}}
.export-short{display:none}
@media(max-width:690px){header h1{white-space:nowrap;font-size:clamp(19px,5.6vw,25px);letter-spacing:-1px}.head-actions{flex-shrink:0}.head-actions .action{white-space:nowrap}.export-long{display:none}.export-short{display:inline}}
</style></head><body>
<header><h1>Boutique studio</h1><div class="head-actions"><div class="history"><button class="action icon-only" id="undo" title="Undo design change" aria-label="Undo design change" disabled><i data-icon="undo"></i></button><button class="action icon-only" id="redo" title="Redo design change" aria-label="Redo design change" disabled><i data-icon="redo"></i></button></div><button class="action" id="jump-save" title="Save design" aria-label="Save design"><i data-icon="bookmark"></i><span>Save design</span></button><button class="action primary" id="export" aria-label="Export image"><i data-icon="download"></i><span class="export-long">Export image</span><span class="export-short" aria-hidden="true">Export</span></button></div></header>
<main><section id="stage" aria-label="Three-dimensional boutique"><canvas tabindex="0" id="view" aria-label="3D shop. Drag to rotate. Arrow keys rotate and plus or minus zoom."></canvas><img id="fallback" hidden alt="Furnished cutaway of the saree boutique"><div id="status" role="status">Opening the boutique…</div>
<div class="stage-top"><div class="stage-quality"><div class="quality" aria-label="Rendering mode"><button id="live" aria-pressed="true">Live</button><button id="trace" aria-pressed="false" title="Refine reflections and shadows with progressive ray tracing">Ray trace</button></div><select id="performance" class="speed-menu" aria-label="Live rendering quality" title="Live rendering quality"><option value="auto">Auto quality</option><option value="fast">Fast preview</option><option value="fine">Fine detail</option></select></div><div class="tools"><button id="zoom-in" aria-label="Zoom in" title="Zoom in"><i data-icon="plus"></i></button><button id="zoom-out" aria-label="Zoom out" title="Zoom out"><i data-icon="minus"></i></button><button id="reset" aria-label="Reset current view" title="Reset current view"><i data-icon="reset"></i></button></div></div><button type="button" id="door" hidden aria-pressed="false">Open sliding door</button><span id="sample" hidden></span><span id="fixture-status" hidden role="status">Loading fixtures…</span>
<div class="stage-bottom"><div id="view-nav" class="view-nav" aria-label="Camera view"></div><span class="nav-hint">Drag to rotate · Scroll or pinch to zoom</span></div></section>
<aside class="designer" aria-label="Design controls"><nav class="tabs" role="tablist" aria-label="Design sections"><button id="tab-finishes" role="tab" aria-controls="panel-finishes" aria-selected="true">Finishes</button><button id="tab-display" role="tab" aria-controls="panel-display" aria-selected="false">Displays</button><button id="tab-lighting" role="tab" aria-controls="panel-lighting" aria-selected="false">Lighting</button><button id="tab-looks" role="tab" aria-controls="panel-looks" aria-selected="false">Designs</button></nav>
<section class="panel" role="tabpanel" aria-labelledby="tab-finishes" id="panel-finishes"><input type="search" class="find-field" id="find-finish" aria-label="Find a finish" placeholder="Find a finish…"><p id="no-finish" class="note" hidden>No matching finishes.</p><div id="finish-controls"></div></section>
<section hidden class="panel" role="tabpanel" aria-labelledby="tab-display" id="panel-display"><div id="display-controls"></div></section>
<section hidden class="panel" role="tabpanel" aria-labelledby="tab-lighting" id="panel-lighting"><div class="group"><div class="group-title"><h2>Fixtures</h2></div><div class="lights" id="light-options"></div></div><div class="group"><div class="group-title"><h2>Light settings</h2></div><div id="ranges"></div></div><button class="action" id="reset-lights">Reset lighting</button></section>
<section hidden class="panel" role="tabpanel" aria-labelledby="tab-looks" id="panel-looks"><div class="group"><div class="group-title"><h2>Starting points</h2></div><div id="presets" class="presets"></div><button type="button" class="action" style="margin-top:12px" id="restore-design">Restore original design</button></div><div class="group"><div class="group-title"><h2>Compare A and B</h2></div><div class="comparison" id="comparison"></div></div><div class="group"><div class="group-title"><h2>Saved designs</h2></div><form class="save-row" id="save-form"><input id="design-name" aria-label="Design name" maxlength="52" placeholder="Design name" required><button class="action" type="submit">Save</button></form><div id="saved"></div><p class="note" id="save-note">Saved in this browser on this device.</p></div><div class="group"><div class="group-title"><h2>Design files</h2></div><div class="file-actions"><button class="action" id="download-design">Download design</button><button class="action" id="import-design">Open design file</button><input type="file" accept=".json,application/json" hidden id="design-file"></div></div></section>
</aside></main><div id="toast" hidden role="status"></div>
<script id="modelData" type="application/json">__MODEL_DATA__</script><script id="referenceData" type="application/json">__REFERENCE_DATA__</script><script id="poster" type="text/plain">__POSTER__</script><script>__BUNDLE__</script>
</body></html>
